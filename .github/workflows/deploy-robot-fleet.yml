name: Deploy Robot Fleet (Docker Compose -> EC2)

on:
  push:
    branches: [ main ]
    paths:
      - 'robot-fleet/**'
      - 'map-source/**'
      - '.github/workflows/deploy-robot-fleet.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  EC2_HOST: ${{ vars.ROS_EC2_HOST || 'ec2-15-135-131-146.ap-southeast-2.compute.amazonaws.com' }}
  EC2_USER: ${{ vars.ROS_EC2_USER || 'ubuntu' }}
  REMOTE_DIR: ${{ vars.ROS_REMOTE_DIR || '/home/ubuntu/robot-fleet' }}
  SERVICE_NAME: dishpatch-robot-fleet

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: dishpatch-robot-fleet-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage Nav2 map source
        run: bash robot-fleet/scripts/stage_nav2_map.sh

      - name: Validate staged Nav2 map source
        run: bash robot-fleet/scripts/stage_nav2_map.sh --check

      - name: Validate Docker Compose config
        working-directory: robot-fleet
        run: docker compose -f docker-compose.yml config >/dev/null

      - name: Prepare SSH key
        env:
          ROS_SSH_KEY: ${{ secrets.ROS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ROS_SSH_KEY}" ]; then
            echo "::error::GitHub secret ROS_SSH_KEY is missing or empty."
            exit 1
          fi
          printf '%s\n' "${ROS_SSH_KEY}" | tr -d '\r' > key.pem
          chmod 600 key.pem
          if ! grep -q 'BEGIN .*PRIVATE KEY' key.pem; then
            echo "::error::ROS_SSH_KEY must contain the private key, not the public key."
            exit 1
          fi
          ssh-keygen -y -f key.pem > key.pub
          echo "Using ROS_SSH_KEY public fingerprint:"
          ssh-keygen -lf key.pub

      - name: Validate SSH connection
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i key.pem \
            "${EC2_USER}@${EC2_HOST}" \
            "echo Connected to \$(hostname) as \$(whoami)"

      - name: Package robot fleet
        run: |
          set -euo pipefail
          tar -czf robot-fleet.tar.gz -C robot-fleet .

      - name: Copy robot fleet package to EC2
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i key.pem \
            robot-fleet.tar.gz \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/tmp/robot-fleet.tar.gz"

      - name: Unpack robot fleet on EC2
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            "SERVICE_NAME='${{ env.SERVICE_NAME }}' REMOTE_DIR='${{ env.REMOTE_DIR }}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          test -n "${REMOTE_DIR}"
          test "${REMOTE_DIR}" != "/"

          sudo systemctl stop "${SERVICE_NAME}.service" || true
          if command -v docker >/dev/null 2>&1 && [ -f "${REMOTE_DIR}/docker-compose.yml" ]; then
            sudo docker compose -f "${REMOTE_DIR}/docker-compose.yml" down --remove-orphans || true
          fi

          rm -rf "${REMOTE_DIR}.next"
          mkdir -p "${REMOTE_DIR}.next"
          tar -xzf /tmp/robot-fleet.tar.gz -C "${REMOTE_DIR}.next"
          rm -f /tmp/robot-fleet.tar.gz
          rm -rf "${REMOTE_DIR}"
          mv "${REMOTE_DIR}.next" "${REMOTE_DIR}"
          REMOTE_SCRIPT

      - name: Install and restart robot fleet service
        run: |
          set -euo pipefail
          # Rebuilds every Docker image, which can hold this session open for a long
          # time with little output. Without the keepalive that ends as
          # "client_loop: send disconnect: Broken pipe", exit 255.
          ssh -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            "REMOTE_DIR='${{ env.REMOTE_DIR }}' SERVICE_USER='${{ env.EC2_USER }}' bash '${{ env.REMOTE_DIR }}/deployment-scripts/setup-robot-fleet-service.sh'"

      - name: Verify robot fleet service
        run: |
          set -euo pipefail

          # Fingerprint the map we are shipping.
          EXPECTED_MAP_SHA=$(sha256sum robot-fleet/config/map.yaml robot-fleet/config/map.png \
            | awk '{print $1}' | sha256sum | awk '{print $1}')
          echo "Staged map fingerprint: ${EXPECTED_MAP_SHA}"

          # ServerAlive*: the checks below poll for up to five minutes while the
          # fleet comes up, and an SSH session left idle that long gets dropped —
          # "client_loop: send disconnect: Broken pipe", exit 255.
          ssh -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            "SERVICE_NAME='${{ env.SERVICE_NAME }}' REMOTE_DIR='${{ env.REMOTE_DIR }}' EXPECTED_MAP_SHA='${EXPECTED_MAP_SHA}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "${REMOTE_DIR}"

          for attempt in $(seq 1 30); do
            if sudo systemctl is-active --quiet "${SERVICE_NAME}.service"; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "::error::${SERVICE_NAME}.service did not become active."
              sudo systemctl --no-pager status "${SERVICE_NAME}.service" || true
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 60); do
            missing=""
            for container in rosbridge nav2 robot1 robot2; do
              if [ "$(sudo docker inspect -f '{{.State.Running}}' "${container}" 2>/dev/null || true)" != "true" ]; then
                missing="${missing} ${container}"
              fi
            done
            if [ -z "${missing}" ]; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "::error::Timed out waiting for containers to run:${missing}"
              sudo docker compose -f docker-compose.yml ps || true
              exit 1
            fi
            sleep 5
          done

          check_ros_graph() {
            local topics actions topic action
            topics=$(sudo docker exec rosbridge bash -lc 'source /opt/ros/jazzy/setup.bash && source /ros2_ws/install/setup.bash && ros2 topic list' 2>/dev/null) || return 1
            actions=$(sudo docker exec rosbridge bash -lc 'source /opt/ros/jazzy/setup.bash && source /ros2_ws/install/setup.bash && ros2 action list' 2>/dev/null) || return 1

            for topic in /robot1/status /robot2/status /robot1/goal_pose /robot2/goal_pose; do
              if ! printf '%s\n' "${topics}" | grep -Fx "${topic}" >/dev/null; then
                return 1
              fi
            done

            for action in /robot1/navigate_to_pose /robot2/navigate_to_pose; do
              if ! printf '%s\n' "${actions}" | grep -Fx "${action}" >/dev/null; then
                return 1
              fi
            done
          }

          ros_graph_ready=""

          for attempt in $(seq 1 60); do
            if check_ros_graph; then
              ros_graph_ready="yes"
              break
            fi
            sleep 5
          done

          if [ -z "${ros_graph_ready}" ]; then
            echo "::error::Timed out waiting for expected ROS topics and actions."
            sudo docker exec rosbridge bash -lc 'source /opt/ros/jazzy/setup.bash && source /ros2_ws/install/setup.bash && ros2 topic list' || true
            sudo docker exec rosbridge bash -lc 'source /opt/ros/jazzy/setup.bash && source /ros2_ws/install/setup.bash && ros2 action list' || true
            exit 1
          fi

          # Did the map we staged actually reach the running fleet? It is baked into
          # the nav2 image by COPY rather than mounted, and the systemd unit starts
          # the stack with `compose up` and no --build, so a rebuild that did not
          # happen leaves the fleet quietly navigating an old map. Nothing else in
          # this pipeline would notice — which is how an 18x oversized costmap ran in
          # production for months.
          #
          # Asserted once, not polled: a file on disk does not become correct by
          # waiting, and retrying it is what turned a wrong map into a five-minute
          # silence and an SSH broken pipe.
          actual_map_sha=$(sudo docker exec nav2 sh -c \
            'sha256sum /ros2_ws/config/map.yaml /ros2_ws/config/map.png | awk "{print \$1}" | sha256sum | awk "{print \$1}"')

          if [ "${actual_map_sha}" != "${EXPECTED_MAP_SHA}" ]; then
            echo "::error::The nav2 container is not running the map that was just staged. The image was probably not rebuilt from the new assets."
            echo "  staged:   ${EXPECTED_MAP_SHA}"
            echo "  deployed: ${actual_map_sha}"
            echo "--- map.yaml inside the nav2 container ---"
            sudo docker exec nav2 cat /ros2_ws/config/map.yaml || true
            exit 1
          fi

          echo "Map fingerprint matches: ${actual_map_sha}"
          sudo systemctl --no-pager status "${SERVICE_NAME}.service"
          sudo docker compose -f docker-compose.yml ps
          REMOTE_SCRIPT
