# This workflow deploys the Dockerized control Nginx first,
# then builds the control backend using Maven and deploys it to EC2.
#
# Before using this workflow:
# - Docker and Docker Compose must be installed on EC2.
# - The existing OS Nginx can continue using ports 80 and 443.
# - compose.test.yaml should bind Docker Nginx to 127.0.0.1:18080.

name: Deploy Control Nginx and Backend

on:
  push:
    branches:
      - main
      - control-docker-deployment
    paths:
      - "control-nginx/**"
      - "control-backend/**"
      - "control-backend/virtual-robots/**"
      - ".github/workflows/deploy-control-backend.yml"

  workflow_dispatch: {}

permissions:
  contents: read

env:
  EC2_HOST: 52.63.53.185
  EC2_USER: ec2-user
  EC2_SSH_KEY_SECRET: EC2_SSH_KEY

  DISH_PATCH_NETWORK_NAME: dishpatch-network

  REMOTE_NGINX_DIR: /home/ec2-user/control-nginx
  NGINX_COMPOSE_FILE: compose.test.yaml
  NGINX_TEST_HTTP_PORT: 18080

  REMOTE_BACKEND_DOCKER_DIR: /home/ec2-user/control-backend-docker
  BACKEND_COMPOSE_FILE: compose.test.yaml
  BACKEND_TEST_HTTP_PORT: 18081

  JAR_NAME: dishpatch-control-backend-1.0.0.jar
  REMOTE_DIR: /home/ec2-user/app
  SERVICE_NAME: dishpatch-control-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Prepare the SSH key before deploying Nginx.
      - name: Prepare SSH key
        id: ssh-key
        run: |
          echo "${{ secrets[env.EC2_SSH_KEY_SECRET] }}" > key.pem
          chmod 600 key.pem

      # ------------------------------------------------------------
      # Deploy Docker Nginx first
      # ------------------------------------------------------------

      - name: Package control Nginx files
        run: |
          tar \
            --exclude="control-nginx/.env" \
            --exclude="control-nginx/.git" \
            -czf control-nginx.tar.gz \
            control-nginx

      - name: Copy control Nginx files to EC2
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            control-nginx.tar.gz \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/control-nginx.tar.gz"

      - name: Deploy control Nginx on EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            "REMOTE_NGINX_DIR='${{ env.REMOTE_NGINX_DIR }}' \
             NGINX_COMPOSE_FILE='${{ env.NGINX_COMPOSE_FILE }}' \
             DISH_PATCH_NETWORK_NAME='${{ env.DISH_PATCH_NETWORK_NAME }}' \
             NGINX_TEST_HTTP_PORT='${{ env.NGINX_TEST_HTTP_PORT }}' \
             bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          echo "Checking Docker installation..."
          docker --version
          docker compose version

          echo "Preparing Nginx deployment directory..."
          rm -rf "${REMOTE_NGINX_DIR}"
          mkdir -p "${REMOTE_NGINX_DIR}"

          tar \
            -xzf /home/ec2-user/control-nginx.tar.gz \
            -C "${REMOTE_NGINX_DIR}" \
            --strip-components=1

          rm -f /home/ec2-user/control-nginx.tar.gz

          cd "${REMOTE_NGINX_DIR}"

          chmod +x scripts/ensure-network.sh

          echo "Ensuring the shared Docker network exists..."
          DISH_PATCH_NETWORK_NAME="${DISH_PATCH_NETWORK_NAME}" \
            ./scripts/ensure-network.sh

          echo "Validating Docker Compose configuration..."
          DISH_PATCH_NETWORK_NAME="${DISH_PATCH_NETWORK_NAME}" \
          NGINX_TEST_HTTP_PORT="${NGINX_TEST_HTTP_PORT}" \
            docker compose \
              -f "${NGINX_COMPOSE_FILE}" \
              config

          echo "Building and starting test Nginx..."
          DISH_PATCH_NETWORK_NAME="${DISH_PATCH_NETWORK_NAME}" \
          NGINX_TEST_HTTP_PORT="${NGINX_TEST_HTTP_PORT}" \
            docker compose \
              -f "${NGINX_COMPOSE_FILE}" \
              up -d \
              --build \
              --remove-orphans

          echo "Validating Nginx configuration..."
          docker compose \
            -f "${NGINX_COMPOSE_FILE}" \
            exec -T nginx nginx -t

          echo "Waiting for Docker Nginx health check..."

          for attempt in $(seq 1 12); do
            if curl \
              --fail \
              --silent \
              --show-error \
              "http://127.0.0.1:${NGINX_TEST_HTTP_PORT}/nginx-health"
            then
              echo
              echo "Docker Nginx is healthy."
              docker compose -f "${NGINX_COMPOSE_FILE}" ps
              exit 0
            fi

            echo "Nginx is not ready yet. Attempt ${attempt}/12..."
            sleep 5
          done

          echo "Docker Nginx failed its health check."

          docker compose \
            -f "${NGINX_COMPOSE_FILE}" \
            ps

          docker compose \
            -f "${NGINX_COMPOSE_FILE}" \
            logs \
            --tail=200 \
            nginx

          exit 1
          REMOTE_SCRIPT

      # ------------------------------------------------------------
      # Keep the existing backend build and deployment
      # ------------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: control-backend/pom.xml

      - name: Build with Maven
        working-directory: control-backend
        run: mvn clean package -DskipTests

      - name: Find built JAR file
        id: find-jar
        run: |
          JAR_FILE=$(find control-backend/target \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)

          if [ -z "${JAR_FILE}" ]; then
            echo "No JAR file found in the target directory."
            exit 1
          fi

          echo "Found JAR: ${JAR_FILE}"
          echo "jar=${JAR_FILE}" >> "${GITHUB_OUTPUT}"

      # ------------------------------------------------------------
      # Deploy duplicate Docker backend
      # ------------------------------------------------------------

      - name: Package Docker backend
        run: |
          set -Eeuo pipefail

          rm -rf backend-docker-package
          mkdir -p backend-docker-package/target

          cp control-backend/Dockerfile \
            backend-docker-package/Dockerfile

          cp control-backend/compose.test.yaml \
            backend-docker-package/compose.test.yaml

          cp "${{ steps.find-jar.outputs.jar }}" \
            "backend-docker-package/target/${{ env.JAR_NAME }}"

          tar \
            -czf control-backend-docker.tar.gz \
            -C backend-docker-package \
            .

          echo "Docker backend package contents:"
          tar -tzf control-backend-docker.tar.gz

      - name: Copy Docker backend package to EC2
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            control-backend-docker.tar.gz \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/control-backend-docker.tar.gz"

      - name: Deploy duplicate Docker backend on EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            "REMOTE_BACKEND_DOCKER_DIR='${{ env.REMOTE_BACKEND_DOCKER_DIR }}' \
             BACKEND_COMPOSE_FILE='${{ env.BACKEND_COMPOSE_FILE }}' \
             BACKEND_TEST_HTTP_PORT='${{ env.BACKEND_TEST_HTTP_PORT }}' \
             NGINX_TEST_HTTP_PORT='${{ env.NGINX_TEST_HTTP_PORT }}' \
             DISH_PATCH_NETWORK_NAME='${{ env.DISH_PATCH_NETWORK_NAME }}' \
             bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          echo "Preparing Docker backend deployment directory..."

          rm -rf "${REMOTE_BACKEND_DOCKER_DIR}"
          mkdir -p "${REMOTE_BACKEND_DOCKER_DIR}"

          tar \
            -xzf /home/ec2-user/control-backend-docker.tar.gz \
            -C "${REMOTE_BACKEND_DOCKER_DIR}"

          rm -f /home/ec2-user/control-backend-docker.tar.gz

          cd "${REMOTE_BACKEND_DOCKER_DIR}"

          echo "Ensuring shared Docker network exists..."

          if ! docker network inspect \
            "${DISH_PATCH_NETWORK_NAME}" >/dev/null 2>&1
          then
            docker network create \
              "${DISH_PATCH_NETWORK_NAME}"
          fi

          echo "Validating backend Compose configuration..."

          DISH_PATCH_NETWORK_NAME="${DISH_PATCH_NETWORK_NAME}" \
            docker compose \
              -f "${BACKEND_COMPOSE_FILE}" \
              config

          echo "Building duplicate Docker backend..."

          DISH_PATCH_NETWORK_NAME="${DISH_PATCH_NETWORK_NAME}" \
            docker compose \
              -f "${BACKEND_COMPOSE_FILE}" \
              build \
              backend

          echo "Starting duplicate Docker backend..."

          DISH_PATCH_NETWORK_NAME="${DISH_PATCH_NETWORK_NAME}" \
            docker compose \
              -f "${BACKEND_COMPOSE_FILE}" \
              up \
              --detach \
              --remove-orphans

          echo "Waiting for duplicate backend to accept HTTP connections..."

          BACKEND_READY=false

          for attempt in $(seq 1 24); do
            HTTP_CODE="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 5 \
                "http://127.0.0.1:${BACKEND_TEST_HTTP_PORT}/" \
                || true
            )"

            if [ "${HTTP_CODE}" != "000" ]; then
              echo "Docker backend responded with HTTP ${HTTP_CODE}."
              BACKEND_READY=true
              break
            fi

            echo "Backend not ready. Attempt ${attempt}/24..."
            sleep 5
          done

          if [ "${BACKEND_READY}" != "true" ]; then
            echo "Duplicate Docker backend failed to start."

            docker compose \
              -f "${BACKEND_COMPOSE_FILE}" \
              ps -a

            docker compose \
              -f "${BACKEND_COMPOSE_FILE}" \
              logs \
              --tail=200 \
              backend

            exit 1
          fi

          echo "Checking routing through Docker Nginx..."

          NGINX_HTTP_CODE="$(
            curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 10 \
              -H "Host: controlapi.dish-patch.com" \
              "http://127.0.0.1:${NGINX_TEST_HTTP_PORT}/" \
              || true
          )"

          echo "Docker Nginx returned HTTP ${NGINX_HTTP_CODE}."

          if [ "${NGINX_HTTP_CODE}" = "000" ] \
            || [ "${NGINX_HTTP_CODE}" = "502" ] \
            || [ "${NGINX_HTTP_CODE}" = "503" ] \
            || [ "${NGINX_HTTP_CODE}" = "504" ]
          then
            echo "Docker Nginx could not reach the Docker backend."

            docker compose \
              -f "${BACKEND_COMPOSE_FILE}" \
              ps -a

            docker compose \
              -f "${BACKEND_COMPOSE_FILE}" \
              logs \
              --tail=200 \
              backend

            exit 1
          fi

          echo "Duplicate Docker backend deployment succeeded."

          docker compose \
            -f "${BACKEND_COMPOSE_FILE}" \
            ps
          REMOTE_SCRIPT

      - name: Ensure backend directory exists on EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            "mkdir -p '${{ env.REMOTE_DIR }}'"

      - name: Copy JAR to EC2
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "${{ steps.find-jar.outputs.jar }}" \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.REMOTE_DIR }}/"

      - name: Copy Python app to EC2
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            control-backend/virtual-robots/virtual-robots.py \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.REMOTE_DIR }}/"

      # For better security, the certificate is still managed separately
      # and is not copied by this workflow.

      - name: Copy backend setup script to EC2
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            control-backend/deployment-scripts/setup-control-backend-service.sh \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/"

      - name: Run backend setup script on EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            "bash /home/ec2-user/setup-control-backend-service.sh \
              '${{ secrets.MQTT_USERNAME }}' \
              '${{ secrets.MQTT_PASSWORD }}'"

      - name: Clean up deployment files
        if: always()
        run: |
          rm -f key.pem
          rm -f control-nginx.tar.gz
          rm -f control-backend-docker.tar.gz
          rm -rf backend-docker-package