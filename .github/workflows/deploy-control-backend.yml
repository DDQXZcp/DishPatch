# This workflow deploys the Dockerized control Nginx first,
# then builds the control backend using Maven and deploys it to EC2.
#
# Before using this workflow:
# - Docker and Docker Compose must be installed on EC2.
# - The existing OS Nginx can continue using ports 80 and 443.
# - compose.test.yaml should bind Docker Nginx to 127.0.0.1:18080.

name: Deploy Control Nginx and Backend

on:
  push:
    branches:
      - main
      - control-docker-deployment
    paths:
      - "control-nginx/**"
      - "control-backend/**"
      - "control-backend/virtual-robots/**"
      - ".github/workflows/deploy-control-backend.yml"

  workflow_dispatch: {}

permissions:
  contents: read

env:
  EC2_HOST: 52.63.53.185
  EC2_USER: ec2-user
  EC2_SSH_KEY_SECRET: EC2_SSH_KEY

  # Nginx deployment
  REMOTE_NGINX_DIR: /home/ec2-user/control-nginx
  NGINX_COMPOSE_FILE: compose.test.yaml
  DISH_PATCH_NETWORK_NAME: dishpatch-network
  NGINX_TEST_HTTP_PORT: 18080

  # Backend deployment
  JAR_NAME: dishpatch-control-backend-1.0.0.jar
  REMOTE_DIR: /home/ec2-user/app
  SERVICE_NAME: dishpatch-control-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Prepare the SSH key before deploying Nginx.
      - name: Prepare SSH key
        id: ssh-key
        run: |
          echo "${{ secrets[env.EC2_SSH_KEY_SECRET] }}" > key.pem
          chmod 600 key.pem

      # ------------------------------------------------------------
      # Deploy Docker Nginx first
      # ------------------------------------------------------------

      - name: Package control Nginx files
        run: |
          tar \
            --exclude="control-nginx/.env" \
            --exclude="control-nginx/.git" \
            -czf control-nginx.tar.gz \
            control-nginx

      - name: Copy control Nginx files to EC2
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            control-nginx.tar.gz \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/control-nginx.tar.gz"

      - name: Deploy control Nginx on EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            "REMOTE_NGINX_DIR='${{ env.REMOTE_NGINX_DIR }}' \
             NGINX_COMPOSE_FILE='${{ env.NGINX_COMPOSE_FILE }}' \
             DISH_PATCH_NETWORK_NAME='${{ env.DISH_PATCH_NETWORK_NAME }}' \
             NGINX_TEST_HTTP_PORT='${{ env.NGINX_TEST_HTTP_PORT }}' \
             bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          echo "Checking Docker installation..."
          docker --version
          docker compose version

          echo "Preparing Nginx deployment directory..."
          rm -rf "${REMOTE_NGINX_DIR}"
          mkdir -p "${REMOTE_NGINX_DIR}"

          tar \
            -xzf /home/ec2-user/control-nginx.tar.gz \
            -C "${REMOTE_NGINX_DIR}" \
            --strip-components=1

          rm -f /home/ec2-user/control-nginx.tar.gz

          cd "${REMOTE_NGINX_DIR}"

          chmod +x scripts/ensure-network.sh

          echo "Ensuring the shared Docker network exists..."
          DISH_PATCH_NETWORK_NAME="${DISH_PATCH_NETWORK_NAME}" \
            ./scripts/ensure-network.sh

          echo "Validating Docker Compose configuration..."
          DISH_PATCH_NETWORK_NAME="${DISH_PATCH_NETWORK_NAME}" \
          NGINX_TEST_HTTP_PORT="${NGINX_TEST_HTTP_PORT}" \
            docker compose \
              -f "${NGINX_COMPOSE_FILE}" \
              config

          echo "Building and starting test Nginx..."
          DISH_PATCH_NETWORK_NAME="${DISH_PATCH_NETWORK_NAME}" \
          NGINX_TEST_HTTP_PORT="${NGINX_TEST_HTTP_PORT}" \
            docker compose \
              -f "${NGINX_COMPOSE_FILE}" \
              up -d \
              --build \
              --remove-orphans

          echo "Validating Nginx configuration..."
          docker compose \
            -f "${NGINX_COMPOSE_FILE}" \
            exec -T nginx nginx -t

          echo "Waiting for Docker Nginx health check..."

          for attempt in $(seq 1 12); do
            if curl \
              --fail \
              --silent \
              --show-error \
              "http://127.0.0.1:${NGINX_TEST_HTTP_PORT}/nginx-health"
            then
              echo
              echo "Docker Nginx is healthy."
              docker compose -f "${NGINX_COMPOSE_FILE}" ps
              exit 0
            fi

            echo "Nginx is not ready yet. Attempt ${attempt}/12..."
            sleep 5
          done

          echo "Docker Nginx failed its health check."

          docker compose \
            -f "${NGINX_COMPOSE_FILE}" \
            ps

          docker compose \
            -f "${NGINX_COMPOSE_FILE}" \
            logs \
            --tail=200 \
            nginx

          exit 1
          REMOTE_SCRIPT

      # ------------------------------------------------------------
      # Keep the existing backend build and deployment
      # ------------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: control-backend/pom.xml

      - name: Build with Maven
        working-directory: control-backend
        run: mvn clean package -DskipTests

      - name: Find built JAR file
        id: find-jar
        run: |
          JAR_FILE=$(find control-backend/target \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)

          if [ -z "${JAR_FILE}" ]; then
            echo "No JAR file found in the target directory."
            exit 1
          fi

          echo "Found JAR: ${JAR_FILE}"
          echo "jar=${JAR_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Ensure backend directory exists on EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            "mkdir -p '${{ env.REMOTE_DIR }}'"

      - name: Copy JAR to EC2
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "${{ steps.find-jar.outputs.jar }}" \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.REMOTE_DIR }}/"

      - name: Copy Python app to EC2
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            control-backend/virtual-robots/virtual-robots.py \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.REMOTE_DIR }}/"

      # For better security, the certificate is still managed separately
      # and is not copied by this workflow.

      - name: Copy backend setup script to EC2
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            control-backend/deployment-scripts/setup-control-backend-service.sh \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/"

      - name: Run backend setup script on EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            "bash /home/ec2-user/setup-control-backend-service.sh \
              '${{ secrets.MQTT_USERNAME }}' \
              '${{ secrets.MQTT_PASSWORD }}'"

      - name: Clean up SSH key
        if: always()
        run: |
          rm -f key.pem control-nginx.tar.gz