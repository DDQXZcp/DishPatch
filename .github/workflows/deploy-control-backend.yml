# Builds the Java backend, deploys Docker Nginx on ports 80/443, and deploys
# the Docker backend as the official backend.
#
# Required repository secret:
#   EC2_SSH_KEY
#
# Before the first run:
#   - Install and start Docker Engine, Docker Compose and Docker Buildx on EC2.
#   - Allow ec2-user to run Docker through sudo.
#   - Point controlapi.dish-patch.com to the EC2 public/Elastic IP.
#   - Allow inbound TCP 22, 80 and 443 in the EC2 security group.
#   - Add control-backend/compose.production.yaml.
#   - Add the production/bootstrap files and deploy-production.sh under control-nginx.

name: Build and Deploy Control Platform (Docker → EC2)

on:
  push:
    branches:
      - main
      - control-docker-deployment
    paths:
      - "control-nginx/**"
      - "control-backend/**"
      - "map-source/**"
      - ".github/workflows/deploy-control-backend.yml"

  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: control-platform-production
  cancel-in-progress: false

env:
  EC2_HOST: 52.63.53.185
  EC2_USER: ec2-user

  DOMAIN: controlapi.dish-patch.com
  DISH_PATCH_NETWORK_NAME: dishpatch-network

  REMOTE_NGINX_DIR: /home/ec2-user/control-nginx
  REMOTE_BACKEND_DIR: /home/ec2-user/control-backend

  NGINX_PRODUCTION_COMPOSE_FILE: compose.production.yaml
  BACKEND_PRODUCTION_COMPOSE_FILE: compose.production.yaml

  JAR_NAME: dishpatch-control-backend-1.0.0.jar

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: control-backend/pom.xml

      # Writes control-backend/src/main/resources/drop-points.json, which Maven
      # packages into the JAR. Must run before the build: the file is gitignored,
      # so it is absent from a fresh checkout.
      - name: Stage map assets
        run: bash map-source/stage-map-assets.sh

      - name: Validate staged map assets
        run: bash map-source/stage-map-assets.sh --check

      # Tests run here as well as in test-control-backend.yml. That workflow is
      # the fast PR signal; this one is the gate that a direct push to main or a
      # workflow_dispatch cannot route around. `package` runs the suite by
      # default, so a red test fails the build well before the first EC2 step.
      - name: Build and test backend with Maven
        working-directory: control-backend
        run: |
          set -Eeuo pipefail
          mvn --batch-mode --no-transfer-progress clean package

      - name: Find built JAR
        id: find-jar
        run: |
          set -Eeuo pipefail

          JAR_FILE="$(
            find control-backend/target \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              | head -n 1
          )"

          if [ -z "${JAR_FILE}" ]; then
            echo "No deployable JAR was found in control-backend/target."
            exit 1
          fi

          echo "Found JAR: ${JAR_FILE}"
          echo "jar=${JAR_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Validate Docker deployment files
        run: |
          set -Eeuo pipefail

          required_files=(
            "control-backend/Dockerfile"
            "control-backend/compose.production.yaml"
            "control-nginx/Dockerfile"
            "control-nginx/compose.bootstrap.yaml"
            "control-nginx/compose.production.yaml"
            "control-nginx/nginx/controlapi.bootstrap.conf"
            "control-nginx/nginx/controlapi.production.conf"
            "control-nginx/scripts/ensure-network.sh"
            "control-nginx/scripts/deploy-production.sh"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "Required deployment file is missing: ${file}"
              exit 1
            fi
          done

      - name: Package Nginx deployment
        run: |
          set -Eeuo pipefail

          tar \
            --exclude="control-nginx/.env" \
            --exclude="control-nginx/.git" \
            -czf control-nginx.tar.gz \
            control-nginx

      - name: Package backend deployment
        run: |
          set -Eeuo pipefail

          rm -rf backend-docker-package
          mkdir -p backend-docker-package/target

          cp control-backend/Dockerfile \
            backend-docker-package/Dockerfile

          cp control-backend/compose.production.yaml \
            backend-docker-package/compose.production.yaml

          cp "${{ steps.find-jar.outputs.jar }}" \
            "backend-docker-package/target/${JAR_NAME}"

          tar \
            -czf control-backend.tar.gz \
            -C backend-docker-package \
            .

          echo "Backend package contents:"
          tar -tzf control-backend.tar.gz

      - name: Prepare SSH
        run: |
          set -Eeuo pipefail

          install -m 700 -d "${HOME}/.ssh"

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" \
            | tr -d '\r' \
            > "${HOME}/.ssh/ec2_key"

          chmod 600 "${HOME}/.ssh/ec2_key"

          for attempt in $(seq 1 10); do
            if ssh-keyscan -H "${EC2_HOST}" \
              >> "${HOME}/.ssh/known_hosts" 2>/dev/null
            then
              break
            fi

            if [ "${attempt}" -eq 10 ]; then
              echo "Could not retrieve the EC2 SSH host key."
              exit 1
            fi

            sleep 5
          done

      - name: Copy deployment packages to EC2
        run: |
          set -Eeuo pipefail

          scp \
            -i "${HOME}/.ssh/ec2_key" \
            control-nginx.tar.gz \
            control-backend.tar.gz \
            "${EC2_USER}@${EC2_HOST}:/home/${EC2_USER}/"

      # Nginx is deployed first. Its production configuration uses deferred
      # Docker DNS resolution, so it can start before the backend container.
      - name: Deploy production Docker Nginx
        run: |
          ssh \
            -i "${HOME}/.ssh/ec2_key" \
            "${EC2_USER}@${EC2_HOST}" \
            "REMOTE_NGINX_DIR='${REMOTE_NGINX_DIR}' \
             DOMAIN='${DOMAIN}' \
             DISH_PATCH_NETWORK_NAME='${DISH_PATCH_NETWORK_NAME}' \
             bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          STAGING_DIR="${REMOTE_NGINX_DIR}.new"

          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}"

          tar \
            -xzf "/home/${USER}/control-nginx.tar.gz" \
            -C "${STAGING_DIR}" \
            --strip-components=1

          rm -f "/home/${USER}/control-nginx.tar.gz"

          rm -rf "${REMOTE_NGINX_DIR}.previous"

          if [ -d "${REMOTE_NGINX_DIR}" ]; then
            mv "${REMOTE_NGINX_DIR}" \
              "${REMOTE_NGINX_DIR}.previous"
          fi

          mv "${STAGING_DIR}" "${REMOTE_NGINX_DIR}"

          cd "${REMOTE_NGINX_DIR}"

          chmod +x \
            scripts/ensure-network.sh \
            scripts/deploy-production.sh

          echo "Deploying Nginx on ports 80 and 443..."

          sudo --preserve-env=DOMAIN,DISH_PATCH_NETWORK_NAME \
            bash ./scripts/deploy-production.sh

          echo "Production Nginx status:"

          sudo docker compose \
            -f "${NGINX_PRODUCTION_COMPOSE_FILE:-compose.production.yaml}" \
            ps

          rm -rf "${REMOTE_NGINX_DIR}.previous"
          REMOTE_SCRIPT

      - name: Deploy official Docker backend
        run: |
          ssh \
            -i "${HOME}/.ssh/ec2_key" \
            "${EC2_USER}@${EC2_HOST}" \
            "REMOTE_BACKEND_DIR='${REMOTE_BACKEND_DIR}' \
             REMOTE_NGINX_DIR='${REMOTE_NGINX_DIR}' \
             BACKEND_PRODUCTION_COMPOSE_FILE='${BACKEND_PRODUCTION_COMPOSE_FILE}' \
             DISH_PATCH_NETWORK_NAME='${DISH_PATCH_NETWORK_NAME}' \
             bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          STAGING_DIR="${REMOTE_BACKEND_DIR}.new"

          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}"

          tar \
            -xzf "/home/${USER}/control-backend.tar.gz" \
            -C "${STAGING_DIR}"

          rm -f "/home/${USER}/control-backend.tar.gz"

          rm -rf "${REMOTE_BACKEND_DIR}.previous"

          if [ -d "${REMOTE_BACKEND_DIR}" ]; then
            mv "${REMOTE_BACKEND_DIR}" \
              "${REMOTE_BACKEND_DIR}.previous"
          fi

          mv "${STAGING_DIR}" "${REMOTE_BACKEND_DIR}"

          cd "${REMOTE_BACKEND_DIR}"

          if ! sudo docker network inspect \
            "${DISH_PATCH_NETWORK_NAME}" >/dev/null 2>&1
          then
            sudo docker network create \
              "${DISH_PATCH_NETWORK_NAME}"
          fi

          echo "Validating backend Compose configuration..."

          DISH_PATCH_NETWORK_NAME="${DISH_PATCH_NETWORK_NAME}" \
            sudo --preserve-env=DISH_PATCH_NETWORK_NAME \
            docker compose \
              -f "${BACKEND_PRODUCTION_COMPOSE_FILE}" \
              config

          echo "Building the official backend image..."

          DISH_PATCH_NETWORK_NAME="${DISH_PATCH_NETWORK_NAME}" \
            sudo --preserve-env=DISH_PATCH_NETWORK_NAME \
            docker compose \
              -f "${BACKEND_PRODUCTION_COMPOSE_FILE}" \
              build \
              backend

          echo "Starting the official backend container..."

          DISH_PATCH_NETWORK_NAME="${DISH_PATCH_NETWORK_NAME}" \
            sudo --preserve-env=DISH_PATCH_NETWORK_NAME \
            docker compose \
              -f "${BACKEND_PRODUCTION_COMPOSE_FILE}" \
              up \
              --detach \
              --remove-orphans \
              backend

          CONTAINER_ID="$(
            sudo docker compose \
              -f "${BACKEND_PRODUCTION_COMPOSE_FILE}" \
              ps -q backend
          )"

          if [ -z "${CONTAINER_ID}" ]; then
            echo "The backend container was not created."
            exit 1
          fi

          NGINX_CONTAINER_ID="$(
            cd "${REMOTE_NGINX_DIR}"

            sudo docker compose \
              -f compose.production.yaml \
              ps -q nginx
          )"

          if [ -z "${NGINX_CONTAINER_ID}" ]; then
            echo "The production Nginx container was not found."
            exit 1
          fi

          echo "Waiting for the backend to accept connections from Docker Nginx..."

          for attempt in $(seq 1 24); do
            BACKEND_STATUS="$(
              sudo docker inspect \
                --format '{{.State.Status}}' \
                "${CONTAINER_ID}" \
                2>/dev/null \
                || true
            )"

            if [ "${BACKEND_STATUS}" = "exited" ] \
              || [ "${BACKEND_STATUS}" = "dead" ]
            then
              echo "Backend container stopped with status: ${BACKEND_STATUS}"

              cd "${REMOTE_BACKEND_DIR}"

              sudo docker compose \
                -f "${BACKEND_PRODUCTION_COMPOSE_FILE}" \
                logs \
                --tail=200 \
                backend

              exit 1
            fi

            if sudo docker exec \
              "${NGINX_CONTAINER_ID}" \
              sh -c 'nc -z dishpatch-backend 8081'
            then
              echo "Backend is accepting connections on port 8081."
              break
            fi

            if [ "${attempt}" -eq 24 ]; then
              echo "Backend did not become reachable within 120 seconds."

              cd "${REMOTE_BACKEND_DIR}"

              sudo docker compose \
                -f "${BACKEND_PRODUCTION_COMPOSE_FILE}" \
                ps -a

              sudo docker compose \
                -f "${BACKEND_PRODUCTION_COMPOSE_FILE}" \
                logs \
                --tail=200 \
                backend

              exit 1
            fi

            echo "Backend is still starting. Attempt ${attempt}/24..."
            sleep 5
          done

          cd "${REMOTE_BACKEND_DIR}"

          sudo docker compose \
            -f "${BACKEND_PRODUCTION_COMPOSE_FILE}" \
            ps

          rm -rf "${REMOTE_BACKEND_DIR}.previous"
          REMOTE_SCRIPT

      - name: Verify production route
        run: |
          set -Eeuo pipefail

          echo "Checking Docker Nginx health endpoint..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            "https://${DOMAIN}/nginx-health"

          echo
          echo "Waiting for Nginx-to-backend routing..."

          for attempt in $(seq 1 24); do
            HTTP_CODE="$(
              curl \
                --silent \
                --output /tmp/control-backend-response.txt \
                --write-out '%{http_code}' \
                --max-time 10 \
                "https://${DOMAIN}/" \
                || true
            )"

            case "${HTTP_CODE}" in
              000|502|503|504)
                echo "Backend route is not ready: HTTP ${HTTP_CODE}. Attempt ${attempt}/24..."
                sleep 5
                ;;

              *)
                echo "Backend route responded with HTTP ${HTTP_CODE}."
                cat /tmp/control-backend-response.txt || true
                echo
                echo "Production Docker deployment succeeded."
                exit 0
                ;;
            esac
          done

          echo "Nginx could not reach the backend after 120 seconds."
          cat /tmp/control-backend-response.txt || true
          exit 1

      - name: Show Docker diagnostics on failure
        if: failure()
        run: |
          ssh \
            -i "${HOME}/.ssh/ec2_key" \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo docker ps -a; \
             echo '===== NGINX LOGS ====='; \
             cd '${REMOTE_NGINX_DIR}' 2>/dev/null && \
             sudo docker compose -f '${NGINX_PRODUCTION_COMPOSE_FILE}' logs --tail=200 || true; \
             echo '===== BACKEND LOGS ====='; \
             cd '${REMOTE_BACKEND_DIR}' 2>/dev/null && \
             sudo docker compose -f '${BACKEND_PRODUCTION_COMPOSE_FILE}' logs --tail=200 || true" \
            || true

      - name: Clean up runner files
        if: always()
        run: |
          rm -f \
            "${HOME}/.ssh/ec2_key" \
            control-nginx.tar.gz \
            control-backend.tar.gz

          rm -rf backend-docker-package
