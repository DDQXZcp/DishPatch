# Spring Boot configuration file.
# Stores app settings (URLs, ports, constants) that can be changed without recompiling the code.

# The fleet size is not configured: the backend asks rosbridge which
# /robot{id}/status topics exist and subscribes to whatever it finds.
rosbridge.url=ws://15.135.131.146:9090

# Load control-backend/.env locally.
# Optional means production can start without this file.
spring.config.import=optional:file:./.env[.properties]

# AWS configuration
aws.region=${AWS_REGION:ap-southeast-2}

# Local credentials from .env.
# These remain empty in EC2 production.
aws.credentials.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.credentials.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.credentials.session-token=${AWS_SESSION_TOKEN:}

# DynamoDB tables
aws.tables.orders=${ORDERS_TABLE:dishpatch-pos-backend-Orders}
aws.tables.users=${USERS_TABLE:dishpatch-pos-backend-Users}
aws.tables.control-backend.users=${CONTROL_BACKEND_USERS_TABLE:Users}

# Manual nav-goal endpoint. Never enable in production.
# It is unauthenticated and commands physical robots, and it existed only as a
# bench-testing tool for the period before order-driven dispatch. Dispatch now
# exists, so the endpoint has no remaining purpose. It was left on in production
# despite the line above; set it in a local .env if you need it for bench work.
nav.test-endpoint.enabled=false

# Meal dispatch pipeline. Commands real robots.
# Set to false to stop dispatching without removing the status endpoint.
dispatch.enabled=true
