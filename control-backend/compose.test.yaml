# Used for local testing
name: dishpatch-control-backend-test

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    environment:
      SERVER_PORT: "8081"
      SERVER_ADDRESS: "0.0.0.0"

    # Optional direct access from the EC2 host for testing.
    # This does not conflict with the existing systemd backend on port 8081.
    ports:
      - "127.0.0.1:18081:8081"

    networks:
      dishpatch-shared:
        aliases:
          - dishpatch-backend

networks:
  dishpatch-shared:
    external: true
    name: "${DISH_PATCH_NETWORK_NAME:-dishpatch-network}"