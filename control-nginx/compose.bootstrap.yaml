name: dishpatch-nginx-bootstrap

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/controlapi.bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - "${CERTBOT_WEBROOT:-/opt/dishpatch/certbot/www}:/var/www/certbot:ro"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://127.0.0.1/nginx-health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s