map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name controlapi.dish-patch.com;
    server_tokens off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "DishPatch production Nginx is healthy\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name controlapi.dish-patch.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/controlapi.dish-patch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/controlapi.dish-patch.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DishPatchSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set $backend_url http://dishpatch-backend:8081;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "DishPatch production Nginx is healthy\n";
    }

    location / {
        proxy_pass $backend_url;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}