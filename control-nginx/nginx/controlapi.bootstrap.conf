server {
    listen 80;
    listen [::]:80;

    server_name controlapi.dish-patch.com;
    server_tokens off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "DishPatch bootstrap Nginx is healthy\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "DishPatch HTTPS setup is in progress\n";
    }
}