# Support WebSocket connection upgrades.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream dishpatch_backend {
    # This name will be the backend container's shared-network alias.
    server dishpatch-backend:8090;

    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    server_name controlapi.dish-patch.com;

    server_tokens off;

    # Nginx container health check.
    # This does not call the backend.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "DishPatch Nginx is healthy\n";
    }

    # SockJS and WebSocket traffic.
    location /ws/ {
        proxy_pass http://dishpatch_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Normal API requests.
    location / {
        proxy_pass http://dishpatch_backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}