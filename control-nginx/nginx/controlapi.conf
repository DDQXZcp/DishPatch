# Used for local testing
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name controlapi.dish-patch.com;
    server_tokens off;

    # Docker's internal DNS server
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Resolve the backend only when an actual request arrives
    set $backend_url http://dishpatch-backend:8081;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "DishPatch Nginx is healthy\n";
    }

    location / {
        proxy_pass $backend_url;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}