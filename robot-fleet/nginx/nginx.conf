server {
    listen 80;
    server_name rosbridge.dish-patch.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name rosbridge.dish-patch.com;

    ssl_certificate /etc/letsencrypt/live/rosbridge.dish-patch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosbridge.dish-patch.com/privkey.pem;

    location / {
        proxy_pass http://rosbridge:9090;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}