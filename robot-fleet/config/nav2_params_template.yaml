ROBOT_NS/bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: ROBOT_NS/base_link
    odom_topic: /ROBOT_NS/odom
    default_nav_to_pose_bt_xml: /ros2_ws/config/navigate_to_pose.xml
    default_nav_through_poses_bt_xml: /ros2_ws/config/navigate_through_poses.xml

    # How long the action server keeps a finished goal before dropping it.
    #
    # Every retained goal stays in the GoalStatusArray published on
    # navigate_to_pose/_action/status, which the control backend subscribes to. This
    # is a rolling window, so the array tracks recent traffic — but the 900s default
    # is wide enough that a busy spell reached 68 entries / 8272 bytes and overflowed
    # the backend's WebSocket frame limit, killing the rosbridge link on every
    # reconnect because the topic is latched. It measured 10 entries while quiet,
    # which is what makes the failure intermittent rather than obvious.
    #
    # The backend only ever looks for ACCEPTED and EXECUTING goals, so nothing reads
    # a finished one — retaining them briefly costs nothing and keeps the peak small.
    action_server_result_timeout: 15.0

ROBOT_NS/controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 2.0
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.8
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: false
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0

ROBOT_NS/local_costmap/local_costmap:
  ros__parameters:
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: ROBOT_NS/odom
    robot_base_frame: ROBOT_NS/base_link
    rolling_window: true
    width: 8
    height: 8
    resolution: 0.05
    plugins: ["static_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: True
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 0.3
    always_send_full_costmap: True

ROBOT_NS/global_costmap/global_costmap:
  ros__parameters:
    update_frequency: 1.0
    publish_frequency: 1.0
    global_frame: map
    robot_base_frame: ROBOT_NS/base_link
    resolution: 0.05
    plugins: ["static_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: True
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 0.3
    always_send_full_costmap: True

ROBOT_NS/map_server:
  ros__parameters:
    yaml_filename: /ros2_ws/config/map.yaml

ROBOT_NS/planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
