  #   environment:
  #     - ROS_DOMAIN_ID=0
  #     - PYTHONUNBUFFERED=1
  #     - ROBOT_NAMESPACE=robot3
  #     - AUTO_CYCLE=true
  #     - INITIAL_BATTERY=50.0
