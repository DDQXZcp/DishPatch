  #     # drop point "counter", same as robot1.
  #     - INITIAL_X=39.029
  #     - INITIAL_Y=14.729
  #     - INITIAL_THETA=0.0
  #     - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
  #
  #   depends_on:
  #     - rosbridge
  #     - nav2
