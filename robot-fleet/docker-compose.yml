# ── dishpatch robot fleet — docker-compose.yml ────────────────────────────────
#
# services
# ────────
#   nginx       — public reverse proxy for rosbridge
#   rosbridge   — bridges ros2 topics to websocket on port 9090
#   nav2        — shared nav2 stack for all robots
#   robot1      — simulated robot, namespace=robot1
#   robot2      — simulated robot, namespace=robot2
#
# external access:
#
#   existing application
#          ↓
#   ec2 :9090
#          ↓
#   rosbridge
#
#   foxglove
#          ↓
#   wss://rosbridge.dish-patch.com
#          ↓
#   nginx :443
#          ↓
#   rosbridge:9090
#
# all containers share the "ros_net" docker network and ROS_DOMAIN_ID=0
# so they see each other's topics without using host networking.
#
# to add more robots: copy the robot1 block, change the service name,
# ROBOT_NAMESPACE, and container_name.
# ──────────────────────────────────────────────────────────────────────────────

networks:
  ros_net:
    driver: bridge

services:

  # ── nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped

    networks:
      - ros_net

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      rosbridge:
        condition: service_healthy


  # ── rosbridge ──────────────────────────────────────────────────────────────
  rosbridge:
    build:
      context: .
      dockerfile: Dockerfile.rosbridge

    container_name: rosbridge
    restart: unless-stopped

    networks:
      - ros_net

    # keep existing host port because your current application uses it
    ports:
      - "9090:9090"

    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import socket; s = socket.create_connection(('127.0.0.1', 9090), 2); s.close()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── nav2 stack (shared by all robots) ──────────────────────────────────────
  #
  # capacity: this one container runs five real-time nodes per robot namespace,
  # so two robots is ten nodes. it was consolidated here to save image size —
  # that argument was about disk and never about cpu.
  #
  # on 2026-08-11 the controllers were missing their 20hz loop, dropping as low
  # as 6hz, while the planner failed to acknowledge goal requests inside nav2's
  # 20ms default. shrinking the map from 16.8m cells to 935k removed most of
  # that load.
  #
  # no cpu/memory limits are set here deliberately: capping a container that is
  # already short of cpu makes it worse.
  #
  # measure before adding a third robot:
  #
  #   nproc
  #   docker stats --no-stream
  #   docker logs nav2 2>&1 | grep -c "Control loop missed"
  #
  # split the stack per robot if the loop-miss count is not near zero.
  nav2:
    build:
      context: .
      dockerfile: Dockerfile.nav2

    container_name: nav2
    restart: unless-stopped

    networks:
      - ros_net

    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
      - ROBOT_NAMESPACES=robot1,robot2
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp

    depends_on:
      - rosbridge


  # ── robot 1 ────────────────────────────────────────────────────────────────
  robot1:
    build:
      context: .
      dockerfile: Dockerfile.robot

    container_name: robot1
    restart: unless-stopped

    networks:
      - ros_net

    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
      - ROBOT_NAMESPACE=robot1
      - AUTO_CYCLE=true
      - INITIAL_BATTERY=100.0

      # Init at the kitchen counter
      - INITIAL_X=39.029
      - INITIAL_Y=14.729
      - INITIAL_THETA=0.0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp

    depends_on:
      - rosbridge
      - nav2


  # ── robot 2 ────────────────────────────────────────────────────────────────
  robot2:
    build:
      context: .
      dockerfile: Dockerfile.robot

    container_name: robot2
    restart: unless-stopped

    networks:
      - ros_net

    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
      - ROBOT_NAMESPACE=robot2
      - AUTO_CYCLE=true
      - INITIAL_BATTERY=75.0

      # Init at the kitchen counter
      - INITIAL_X=39.029
      - INITIAL_Y=14.729
      - INITIAL_THETA=0.0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp

    depends_on:
      - rosbridge
      - nav2


  # ── robot 3 ────────────────────────────────────────────────────────────────
